name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      id: dependencies
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt -r requirements-ci.txt
        .venv/bin/python -m pip check
    - name: Install PDF rendering libraries
      id: pdf
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
    - name: Analysing the code with pylint
      run: |
        .venv/bin/python -m pylint --py-version=${{ matrix.python-version }} $(git ls-files '*.py')
    - name: Run regression tests
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.pdf.outcome == 'success' }}
      run: .venv/bin/python -m unittest discover -s tests -v
